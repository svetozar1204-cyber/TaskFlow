
services:
  db:
    image: postgres:16-alpine
    container_name: taskflow_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web1:
    build: .
    container_name: taskflow_web1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TASKFLOW_INSTANCE: web1
    expose:
      - "5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  web2:
    build: .
    container_name: taskflow_web2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TASKFLOW_INSTANCE: web2
    expose:
      - "5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    restart: unless-stopped
    ports:
      - "5000:80"
      - "5443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web1
      - web2

volumes:
  postgres_data:
